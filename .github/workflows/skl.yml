name: skl

on:
  push:
    paths:
      - "skl/**"
  pull_request:
    paths:
      - "skl/**"

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh
      - name: Run tests
        working-directory: skl
        run: python3 -m unittest discover -s tests -v
